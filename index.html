<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>临床研究队列管理平台 · 交互原型 V2.0</title>
<style>
  :root{
    --ink:#10243a; --ink2:#33475e; --muted:#66788d; --line:#e2e9f2;
    --bg:#e9eef5; --card:#fff; --primary:#5b4fb3; --primary2:#7c6ae0;
    --teal:#7c6ae0; --gold:#c0902c; --red:#c2413b; --green:#0b7a5b;
    --radius:12px; --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:"SFMono-Regular",Menlo,Monaco,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    font-size:14px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ---------- demo topbar ---------- */
  .topbar{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
  .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5b21b6,#a78bfa);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.5px}
  .brand small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.7px}
  .tag-demo{font-size:12px;color:#5b4fb3;background:#f0edff;border:1px solid #ddd6fe;border-radius:999px;padding:3px 9px;font-weight:600;white-space:nowrap}
  .spacer{flex:1}

  /* ---------- layout ---------- */
  .stage{height:100vh;padding:0;display:block;background:#f5f8fc}
  .win{height:100vh;min-height:0;background:#fff;border-radius:0;overflow:hidden;display:flex;flex-direction:column;box-shadow:none}
  .titlebar{height:38px;background:#f4f7fb;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
  .dot{width:10px;height:10px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .win-title{flex:1;text-align:center;font-size:12px;color:var(--muted);margin-right:46px}
  .win-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .live{width:6px;height:6px;border-radius:50%;background:#8b7cf0;box-shadow:0 0 6px rgba(139,124,240,.6)}
  .body{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr)}

  /* ---------- sidebar（参考样式：靛紫菜单） ---------- */
  .sidebar{grid-row:1/3;background:linear-gradient(180deg,#4f44a8 0%,#453a93 100%);color:rgba(255,255,255,.9);display:flex;flex-direction:column;min-height:0}
  .sb-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 10px}
  .sb-brand .mark{width:42px;height:42px;border-radius:13px;font-size:13px;background:linear-gradient(135deg,#8b7cf0,#6d5bd0);box-shadow:0 6px 16px rgba(24,16,64,.3);letter-spacing:.5px}
  .sb-brand b{display:block;color:#fff;font-size:15px;line-height:1.3}
  .sb-brand span{display:block;color:rgba(255,255,255,.62);font-size:12px;letter-spacing:.3px}
  .sb-proj{margin:4px 12px 6px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);font-size:12px;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:7px;cursor:pointer}
  .sb-proj:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24)}
  .sb-proj b{color:#fff;font-size:13px}
  .sb-proj i{margin-left:auto;font-style:normal;color:rgba(255,255,255,.65);font-size:12px}
  .sb-nav{flex:1;overflow:auto;padding:4px 10px 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
  .sb-nav::-webkit-scrollbar{width:6px}
  .sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:3px}
  .sb-nav::-webkit-scrollbar-track{background:transparent}
  .sb-pin{padding:2px 0}
  .sb-sep{height:1px;background:rgba(255,255,255,.14);margin:8px 10px 6px}
  .sb-group{margin-bottom:2px}
  .sb-title{font-size:12px;letter-spacing:.4px;color:rgba(255,255,255,.45);font-weight:600;padding:10px 9px 5px;display:flex;align-items:center;gap:7px}
  .sb-title::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.14)}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;color:rgba(255,255,255,.88);font-size:14px;cursor:pointer;border:1px solid transparent;position:relative;transition:background .15s,color .15s}
  .nav:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav.active{background:#5b4fb3;color:#fff;font-weight:600;border-color:transparent;box-shadow:0 4px 12px rgba(20,12,50,.18)}
  .nav.active::before{display:none}
  .nav svg{width:18px;height:18px;stroke-width:1.8;opacity:.85;flex-shrink:0}
  .nav.active svg{opacity:1}
  .nav .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;background:#ef2b4f;color:#fff;border-radius:999px;padding:0 6px;line-height:18px;font-weight:600}
  .sb-foot{margin-top:auto;padding:8px 10px 14px;border-top:none}
  .sb-foot .nav{color:rgba(255,255,255,.75);padding:8px 10px}
  .sb-foot .nav:hover{color:#fff}


  /* ---------- 一级 / 二级菜单 ---------- */
  .nav-group{display:flex;align-items:center;gap:8px;padding:8px 9px;margin-top:3px;border-radius:9px;color:rgba(255,255,255,.72);font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
  .nav-group:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-group.active{background:rgba(255,255,255,.08);color:#fff}
  .nav-group .chev-svg{width:14px;height:14px;flex-shrink:0;opacity:.9;transition:transform .15s}
  .nav-group .chev-svg.closed{transform:rotate(-90deg)}
  .nav-group .gcount{margin-left:auto;font-size:12px;font-weight:500;color:rgba(255,255,255,.45)}
  .sb-sub{display:flex;flex-direction:column;gap:1px;margin:0 0 5px;padding-left:14px}
  .sb-sub.collapsed{display:none}
  .nav.sub{padding:7px 9px;border-radius:9px}
  .nav.sub svg{width:17px;height:17px}
  .nav.sub .cnt{margin-left:auto}
  /* ---------- chrome ---------- */
  .chrome{grid-column:2;grid-row:1;display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);min-width:0}
  .crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
  .crumb b{color:var(--ink);font-weight:600}
  .crumb i{font-style:normal;color:#c3cfdd}
  .search{position:relative;margin-left:auto;width:210px}
  .search .input{height:32px;font-size:12px;padding-left:26px;background:#f8f7fd}
  .search::before{content:"";position:absolute;left:9px;top:9px;width:9px;height:9px;border:1.5px solid #8ba0b6;border-radius:50%}
  .search::after{content:"";position:absolute;left:17px;top:16px;width:4px;height:1.5px;background:#8ba0b6;transform:rotate(45deg)}
  .chrome-user{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--line)}
  .chrome-user .cu-av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#6d28d9,#a78bfa);color:#fff;font-size:12px;font-weight:700}
  .chrome-user b{display:block;font-size:12px;line-height:1.2;color:#10243a}
  .chrome-user span{display:block;font-size:12px;color:var(--muted)}
  .role{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
  .role select{border:1px solid var(--line);background:#f8f7fd;border-radius:6px;font-size:12px;padding:3px 5px;color:var(--ink)}
  .bell{position:relative;width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:#5b6b7f}
  .bell:hover{background:#f4f7fb;color:var(--primary)}
  .bell svg{width:12px;height:12px}
  .bell .nd{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--red)}
  .main{grid-column:2;grid-row:2;background:#f5f8fc;padding:20px 24px 26px;overflow:auto}

  /* ---------- common ---------- */
  .head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
  .head h1{margin:0;font-size:18px;letter-spacing:-.2px;line-height:1.3}
  .head .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .acts{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 7px rgba(16,36,58,.04);overflow:hidden}
  .panel + .panel{margin-top:12px}
  .ph{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid #eef3f9}
  .ph h3{margin:0;font-size:14px}
  .ph .more{margin-left:auto;font-size:12px;color:var(--muted)}
  .pb{padding:12px 14px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .muted{color:var(--muted)} .tiny{font-size:12px} .mono{font-family:var(--mono);font-size:12px}
  .right{text-align:right} .nowrap{white-space:nowrap}

  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;box-shadow:0 2px 7px rgba(16,36,58,.04);position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#6d5bd0,#8b7cf0)}
  .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#f1eeff;color:#4f44a8;font-size:12px;font-weight:700;flex-shrink:0}
  .stat .v{font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
  .stat .l{font-size:12px;color:var(--muted)}
  .stat .d{font-size:12px;margin-top:1px}
  .up{color:var(--green)} .down{color:var(--red)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:.15s}
  .btn-p{background:var(--primary);color:#fff}
  .btn-p:hover{background:#443a8f;transform:translateY(-1px);box-shadow:0 4px 12px rgba(91,79,179,.28)}
  .btn-s{background:#fff;color:var(--ink2);border-color:var(--line)}
  .btn-s:hover{border-color:#c4b5fd;background:#faf8ff;color:var(--primary)}
  .btn-d{background:#fff;color:var(--red);border-color:#f0cfcb}
  .btn-d:hover{background:#fdecea}
  .btn-sm{height:30px;padding:0 12px;font-size:12px;border-radius:7px}
  .btn-xs{height:27px;padding:0 9px;font-size:12px;border-radius:6px}
  .link{border:none;background:none;color:var(--primary2);font-size:12px;cursor:pointer;padding:2px 3px}
  .link:hover{text-decoration:underline}
  .link.danger{color:var(--red)}

  .input,.select{height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:12px;padding:0 9px;outline:none;width:100%}
  .input:focus,.select:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(124,106,224,.18)}
  .toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .toolbar .input{width:230px}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 7px;border-radius:999px;background:#f2f6fb;color:#41556c;border:1px solid #e2e9f2;white-space:nowrap}
  .chip.teal{background:#f0edff;color:#5b4fb3;border-color:#ddd6fe}
  .chip.gold{background:#fdf5e3;color:#8a6415;border-color:#f0dfb8}
  .chip.red{background:#fdecea;color:#a33630;border-color:#f3cdc9}

  /* ---------- table ---------- */
  .tw{overflow:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  .tbl thead th{text-align:left;font-size:12px;color:#61748a;font-weight:600;background:#f8f7fd;padding:8px 11px;border-bottom:1px solid var(--line);position:sticky;top:0}
  .tbl td{padding:9px 12px;border-bottom:1px solid #eff4f9;color:#2f4358;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover td{background:#fafcfe}
  .tbl .st{font-weight:600;color:var(--ink)}
  .tbl .num{font-family:var(--mono);font-size:12px}
  .rowlink{cursor:pointer}
  .empty{padding:24px;text-align:center;color:#8ba0b6;font-size:12px}
  .badge{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
  .b-green{background:#e7f6f0;color:#0b7a5b;border-color:#b9e3d3}
  .b-gold{background:#fdf5e3;color:#8a6415;border-color:#f0dfb8}
  .b-red{background:#fdecea;color:#a33630;border-color:#f3cdc9}
  .b-blue{background:#f1eeff;color:#5b4fb3;border-color:#ddd6fe}
  .b-gray{background:#f2f5f9;color:#5b6b7f;border-color:#e2e9f2}
  .db{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#2f4358}
  .db::before{content:"";width:5px;height:5px;border-radius:50%;background:#9db0c4}
  .db.ok::before{background:var(--green)} .db.warn::before{background:#c2820f}
  .db.bad::before{background:var(--red)} .db.info::before{background:var(--primary2)}
  .progress{height:5px;background:#eef3f9;border-radius:3px;overflow:hidden;flex:1}
  .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#6d5bd0,#8b7cf0)}
  .fill.g{background:linear-gradient(90deg,#0b7a5b,#37a97f)}
  .fill.w{background:linear-gradient(90deg,#c2820f,#d9a53a)}

  /* ---------- home ---------- */
  .trend{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:6px}
  .tcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  .tbar{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#8b7cf0,#4f44a8);opacity:.9;min-height:3px}
  .tcol:hover .tbar{opacity:1;box-shadow:0 0 0 2px rgba(139,124,240,.22)}
  .tlb{font-size:12px;color:#8ba0b6;font-family:var(--mono)}
  .legend{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:4px}
  .ld{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:4px}
  .kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #e8eef6}
  .kv:last-child{border-bottom:none}
  .kv .k{font-size:12px;color:#5b6b7f} .kv .v{font-size:12px;font-weight:600}
  .quick{display:flex;flex-wrap:wrap;gap:6px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-size:12px;color:#33475e;cursor:pointer}
  .quick button:hover{border-color:#c4b5fd;background:#faf8ff;color:var(--primary)}

  /* ---------- split / list / builder ---------- */
  .split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px}
  .list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .li{padding:9px 11px;border-bottom:1px solid #eff4f9;cursor:pointer}
  .li:last-child{border-bottom:none}
  .li:hover{background:#f8fbfe}
  .li.active{background:#eef6ff;border-left:2px solid var(--primary2)}
  .li b{display:block;font-size:12px} .li span{display:block;font-size:12px;color:#8ba0b6;margin-top:1px}
  .fcard{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #e6edf6;border-radius:7px;margin-bottom:5px;background:#fbfdff}
  .fcard b{font-size:12px} .fcard span{font-size:12px;color:#8ba0b6;margin-left:auto}
  .fcard .rm{border:none;background:none;color:#b3c1d1;cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
  .fcard .rm:hover{color:var(--red)}
  .vline{position:relative;padding-left:20px}
  .vline::before{content:"";position:absolute;left:6px;top:7px;bottom:7px;width:2px;background:#e3ebf5}
  .visit{position:relative;padding-bottom:14px}
  .visit::before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #8b7cf0}
  .visit.done::before{background:#8b7cf0}
  .visit b{font-size:12px}
  .visit .meta{font-size:12px;color:#7f92a7;margin-top:1px}
  .visit .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}

  .hero{display:flex;align-items:flex-start;gap:13px;margin-bottom:12px}
  .hero .avatar{width:42px;height:42px;border-radius:11px;font-size:15px}
  .hero h2{margin:0;font-size:16px}
  .hero .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .hero .ops{margin-left:auto;display:flex;gap:6px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow:auto}
  .tab{border:none;background:none;padding:7px 11px;font-size:12px;color:#61748a;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab:hover{color:var(--primary)}
  .tab.active{color:var(--primary);font-weight:600;border-bottom-color:var(--primary)}
  .frow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0}
  .frow > label{font-size:12px;color:#5b6b7f;text-align:right}
  .frow label .req{color:var(--red);margin-right:2px}
  .frow .input,.frow .select{height:32px;font-size:12px}
  .frow .err{grid-column:2;color:var(--red);font-size:12px}
  .radio{display:flex;gap:12px;font-size:12px;align-items:center}
  .radio label{font-size:12px;color:#2f4358;display:flex;gap:5px;align-items:center}

  /* ---------- charts ---------- */
  .donut{width:118px;height:118px;border-radius:50%;position:relative;flex-shrink:0}
  .donut::after{content:"";position:absolute;inset:22px;background:#fff;border-radius:50%}
  .donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1}
  .donut .mid b{display:block;font-size:17px;line-height:1.2}
  .dist{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .dname{width:78px;text-align:right;font-size:12px;color:var(--muted);flex-shrink:0}
  .dwrap{flex:1;height:6px;background:#eef3f9;border-radius:3px;overflow:hidden}
  .dfill{height:100%;border-radius:3px;background:linear-gradient(90deg,#6d5bd0,#8b7cf0)}
  .dval{width:20px;text-align:right;font-family:var(--mono);font-size:12px}

  /* ---------- modal / toast ---------- */
  .mask{position:fixed;inset:0;background:rgba(8,20,35,.46);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:18px;animation:fade .15s}
  .modal{width:560px;max-width:94vw;max-height:88vh;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s}
  .mh{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .mh h3{margin:0;font-size:14px}
  .mh .x{margin-left:auto;width:24px;height:24px;border:none;border-radius:6px;background:#f3f6fa;color:#6b7d91;cursor:pointer;font-size:14px;line-height:1}
  .mh .x:hover{background:#e9eff7;color:var(--ink)}
  .mb{padding:14px 18px;overflow:auto}
  .mf{display:flex;justify-content:flex-end;gap:7px;padding:10px 18px;border-top:1px solid var(--line);background:#fbfdff}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:9px 11px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12px;color:#5b6b7f}
  .field .input,.field .select{height:34px}
  .field textarea{min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:inherit;font-size:12px;outline:none}
  .field textarea:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(124,106,224,.18)}
  .hint{font-size:12px;color:#8ba0b6;margin-top:5px}

  .toasts{position:fixed;top:64px;right:18px;z-index:200;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  .toast{background:#10243a;color:#fff;font-size:12px;padding:8px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:7px;max-width:360px;animation:slide .18s}
  .toast::before{content:"";width:5px;height:5px;border-radius:50%;background:#37b3b3}
  .toast.ok::before{background:#42d3a0} .toast.warn::before{background:#f0b54a} .toast.err::before{background:#ff8177}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes slide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

  .panel-r{display:flex;flex-direction:column;gap:11px;overflow:auto;min-height:0;padding-right:1px}

  .rc h3{margin:0 0 3px;font-size:14px}
  .rc p{margin:0;font-size:12px;color:#61748a;line-height:1.7}
  .tips{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}

  .flow{display:flex;flex-direction:column;gap:5px}
  .flow button{display:flex;align-items:center;gap:7px;text-align:left;border:1px solid #e6edf6;background:#fff;border-radius:7px;padding:6px 8px;font-size:12px;color:#33475e;cursor:pointer}
  .flow button:hover{border-color:#c4b5fd;background:#faf8ff}
  .step-no{width:17px;height:17px;border-radius:5px;background:#f1eeff;color:var(--primary);font-size:12px;font-weight:700;display:grid;place-items:center;flex-shrink:0}

  .panel-toggle{display:none}



  /* ---------- 日历 ---------- */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cal-dow{background:#f7f5fd;color:#5b6b7f;font-size:12px;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
  .cal-cell{min-height:92px;padding:6px 7px;border-right:1px solid #eef3f9;border-bottom:1px solid #eef3f9;background:#fff}
  .cal-cell:nth-child(7n){border-right:none}
  .cal-cell.out{background:#fafbfd}
  .cal-cell.today{background:#f7f4ff;box-shadow:inset 0 0 0 2px #c4b5fd}
  .cal-num{font-size:12px;font-weight:600;color:#33475e;margin-bottom:3px}
  .cal-cell.today .cal-num{color:#4f44a8}
  .cal-ev{display:block;width:100%;text-align:left;border:none;border-radius:5px;padding:3px 5px;font-size:12px;line-height:1.35;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#f1eeff;color:#4f44a8}

  .cal-ev.gold{background:#fdf5e3;color:#8a6415}
  .cal-ev.red{background:#fdecea;color:#a33630}
  .cal-ev.gray{background:#f2f5f9;color:#5b6b7f}

  .form-sec{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}

  .validate-note b{display:block;font-size:14px;margin-bottom:2px}
  .tbl th.center,.tbl td.center{text-align:center}
  /* ---------- readability: 提示 >=12px, 正文 >=14px ---------- */
  body{font-size:14px}
  .tbl,.tbl tbody td{font-size:14px}
  .tbl thead th{font-size:12px}
  .input,.select,.field .input,.field .select,.frow .input,.frow .select,textarea{font-size:14px}
  .tbl .num,.mono,.tiny,.hint,.chip,.badge,.db,.legend,.tlb,.dname,.dval,.rc h4{font-size:12px}
  .kv .k{font-size:12px} .kv .v{font-size:14px}
  .li b,.visit b,.rc h3,.mh h3{font-size:14px}
  .li span,.visit .meta,.head .sub,.ph .more,.stat .l,.stat .d,.sb-title,.sb-brand span,.sb-user span{font-size:12px}
  .tab,.btn{font-size:14px}
  .btn-sm,.btn-xs,.link{font-size:12px}
  .head h1{font-size:20px}
  .stat .v{font-size:24px}
  .chip{height:24px;padding:2px 9px}
  .tips li,.flow button,.note-r{font-size:12px}
  .rc p{font-size:14px}
  .rc p{line-height:1.7}
  .tips li{padding:6px 8px}

  }

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b)=>Math.min(100,Math.round(a/(b||1)*100));

function toast(msg,type='ok'){
  const t=document.createElement('div');
  t.className='toast '+type; t.textContent=msg;
  $('#toastRoot').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(10px)';t.style.transition='all .2s'},2300);
  setTimeout(()=>t.remove(),2550);
}
function modal(title, body, footer=''){
  $('#modalRoot').innerHTML=`<div class="mask" data-mask><div class="modal" role="dialog" aria-modal="true">
    <div class="mh"><h3>${title}</h3><button class="x" data-action="close-modal">×</button></div>
    <div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}</div></div>`;
  const f=$('#modalRoot .mb input, #modalRoot .mb select, #modalRoot .mb textarea');
  if(f) setTimeout(()=>f.focus(),50);
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function badge(s){
  const m={'进行中':'b-blue','已锁库':'b-gray','启用':'b-green','停用':'b-gray','已完成':'b-green','未完成':'b-gold',
    '有质询':'b-gold','超窗':'b-red','未解决':'b-gold','已解决':'b-green','待审核':'b-gold','通过':'b-green',
    '驳回':'b-red','已入库':'b-green','已出库':'b-blue','已采集':'b-gold','待仲裁':'b-gold','一致':'b-green',
    '成功':'b-green','失败':'b-red','待处理':'b-gold','已处理':'b-green','未到访':'b-gray','生成中':'b-gold','已销毁':'b-gray',
    '待质询':'b-gold','锁定':'b-gray','未开始':'b-gray','停止':'b-gray','入组中':'b-blue'};
  return `<span class="badge ${m[s]||'b-gray'}">${s}</span>`;
}
function bar(a,b,cls=''){
  return `<div style="display:flex;align-items:center;gap:7px;min-width:110px"><div class="progress"><div class="fill ${cls}" style="width:${pct(a,b)}%"></div></div><span class="mono" style="width:32px;text-align:right">${pct(a,b)}%</span></div>`;
}
function pageHead(title,sub,acts=''){
  return `<div class="head"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="acts">${acts}</div></div>`;

function stat(ico,v,l,d,cls='up'){
  return `<div class="stat"><div class="ico">${ico}</div><div><div class="v">${v}</div><div class="l">${l}</div><div class="d ${cls}">${d}</div></div></div>`;

function go(page){

}

/* ================= 受试者详情 ================= */
function renderSubjectDetail(){
  const s=db.subjects.find(x=>x.id===state.subject)||db.subjects[0];
  const qs=db.queries.filter(q=>q.subject===s.id);
  const tabs=[['visits','访视信息'],['crf','数据采集'],['samples','样本'],['queries','质询']];
  let body='';
  if(state.tab==='visits'){
    body=`<div class="vline">${db.plan.activities.map(a=>`
      <div class="visit ${a.status==='已完成'?'done':''}">
        <div style="display:flex;align-items:center;gap:7px"><b>${a.code} · ${a.name}</b>${badge(a.status)}</div>
        <div class="meta">计划 ${a.schedule} · 窗口 ${a.window} · ${a.forms} 张表单</div>
        <div class="chips"><button class="btn btn-s btn-xs" data-action="open-crf" data-visit="${a.code}">进入采集</button>
        <button class="btn btn-s btn-xs" data-action="raise-query" data-form="${a.name}">发起质询</button></div></div>`).join('')}</div>`;
  } else if(state.tab==='crf'){
    const crf=db.queue.crf||{title:'生命体征',fields:[]};
    body=`
      <div class="panel" style="border:none;box-shadow:none">
        <div class="ph" style="padding-left:0"><h3>${s.visit} · ${crf.title}</h3><span class="more">必填项未填将阻断提交</span></div>
        <div class="pb" style="padding-left:0">
          ${crf.fields.map(f=>`<div class="frow"><label>${f.req?'<span class="req">*</span>':''}${f.label}</label>
            <input class="input" id="${f.id}" ${f.type==='date'?'type="date"':''} value="${f.value||''}" placeholder="${f.ph||''}" />
            <div class="err" id="${f.id}Err" style="display:none">请输入 ${f.label}${f.min!=null?`（${f.min} ~ ${f.max}）`:''}</div></div>`).join('')}
          <div class="frow"><label>备注</label><input class="input" placeholder="选填" /></div>
          <div style="display:flex;gap:7px;margin-top:10px;padding-left:128px">
            <button class="btn btn-s btn-sm" data-action="save-crf">保存</button>
            <button class="btn btn-p btn-sm" data-action="submit-crf">提交</button>
            <button class="btn btn-s btn-sm" data-action="raise-query" data-form="${crf.title}">发起质询</button></div>
          <div class="hint" style="padding-left:128px">提交时按 CRF 规则校验必填与取值范围。</div>
        </div></div>`;
  } else if(state.tab==='samples'){
    const rows=db.samples.filter(x=>x.subject===s.id);
    body=`<table class="tbl"><thead><tr><th>样本编码</th><th>类型</th><th>访视</th><th>库位</th><th>状态</th><th>采集时间</th><th class="right">操作</th></tr></thead>
      <tbody>${rows.map(x=>`<tr><td class="mono">${x.code}</td><td>${x.type}</td><td>${x.visit}</td><td class="mono">${x.box}</td>
        <td>${badge(x.status)}</td><td class="mono">${x.time}</td>
        <td class="right"><button class="link" data-action="next-sample" data-code="${x.code}">推进状态</button></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">暂无样本</div></td></tr>`}</tbody></table>
      <div style="margin-top:9px"><button class="btn btn-p btn-sm" data-action="collect-sample" data-id="${s.id}">采集样本</button></div>`;
  } else {
    body=`<table class="tbl"><thead><tr><th>编号</th><th>表单 / 字段</th><th>类型</th><th>状态</th><th>提出人</th><th>时间</th><th class="right">操作</th></tr></thead>
      <tbody>${qs.map(q=>`<tr><td class="mono">${q.id}</td><td>${q.form} / <b>${q.field}</b></td>
        <td><span class="chip ${q.type==='更新类'?'gold':'teal'}">${q.type}</span></td><td>${badge(q.status)}</td>
        <td>${q.from}</td><td class="mono">${q.time}</td>
        <td class="right">${q.status==='未解决'?`<button class="link" data-action="resolve-query" data-id="${q.id}">解决</button>`:'<span class="tiny muted">已闭环</span>'}</td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">暂无质询</div></td></tr>`}</tbody></table>`;

/* ================= 多队列辅助 ================= */
function archivePeople(a){
  if(a.people && a.people.length) return a.people;
  return [{label:'女方',name:a.female,id:a.fid},{label:'男方',name:a.male,id:a.mid}].filter(p=>p.name&&p.name!=='—');
}
function archiveNames(a){ return archivePeople(a).map(p=>p.name).join(' / '); }
function currentProject(){ return db.projects.find(p=>p.short===state.currentQueue)||db.projects[0]; }
function queueLead(){ return db.queue.lead || currentProject().org; }
function queueOfSite(code){
  if(!code) return '—';
  if(code.startsWith('D')) return 'DEPRESSION';
  if(code.startsWith('H')) return 'HIP';
  if(code.startsWith('S')) return 'SAPPHIRE';
  return '—';
}

/* ================= 任务日历 ================= */
function renderCalendar(){
  const y=state.calYear||2026, m=state.calMonth==null?10:state.calMonth;
  const first=new Date(y,m,1);
  const offset=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  const cells=Math.ceil((offset+days)/7)*7;
  const pad=n=>String(n).padStart(2,'0');
  const dateStr=d=>`${y}-${pad(m+1)}-${pad(d)}`;
  const evBy=d=>db.calendar.filter(e=>e.date===dateStr(d));
  const today='2026-11-13';
  const statusCls=s=>({'已完成':'green','有质询':'gold','未完成':'red','未开始':'gray'}[s]||'');
  const todayEvents=db.calendar.filter(e=>e.date===today);
  const upcoming=db.calendar.filter(e=>e.date>=today).slice(0,5);
  const list=todayEvents.length?todayEvents:upcoming;
  return `${pageHead('任务日历',`${y} 年 ${m+1} 月 · 随访任务与到访状态`,`
      <button class="btn btn-s btn-sm" data-action="cal-today">回到今天</button>
      <button class="btn btn-s btn-sm" data-action="go" data-page="subjects">对象列表</button>`)}
    <div class="panel">
      <div class="ph"><h3>${y} 年 ${m+1} 月</h3>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="btn btn-s btn-xs" data-action="cal-prev">‹ 上一月</button>
          <button class="btn btn-s btn-xs" data-action="cal-next">下一月 ›</button>
        </div></div>
      <div class="pb">
        <div class="cal-grid">
          ${['一','二','三','四','五','六','日'].map(d=>`<div class="cal-dow">周${d}</div>`).join('')}
          ${Array.from({length:cells}).map((_,i)=>{
            const d=i-offset+1;
            if(d<1||d>days) return `<div class="cal-cell out"></div>`;
            const evs=evBy(d);
            const isToday=dateStr(d)===today;
            return `<div class="cal-cell ${isToday?'today':''}">
              <div class="cal-num">${d}${isToday?' · 今天':''}</div>
              ${evs.slice(0,2).map(e=>`<button class="cal-ev ${statusCls(e.status)}" data-action="calendar-event" data-id="${e.subject}" title="${e.time} ${e.activity} · ${e.status}">${e.time} ${e.activity} · ${e.subject}</button>`).join('')}
              ${evs.length>2?`<div class="cal-more">+${evs.length-2} 项</div>`:''}
            </div>`;
          }).join('')}
        </div>
        <div class="hint">点击日历任务进入受试者详情；颜色对应活动状态（绿=已完成、黄=有质询、红=未完成、灰=未开始）。</div>
      </div>
    </div>
    <div class="panel"><div class="ph"><h3>${todayEvents.length?'今日任务':'近期任务'}</h3><span class="more">${list.length} 项</span></div>
      <div class="tw"><table class="tbl"><thead><tr><th>时间</th><th>受试者</th><th>活动</th><th>分中心</th><th>状态</th><th class="right">操作</th></tr></thead>
      <tbody>${list.map(e=>`<tr><td class="mono">${e.date} ${e.time}</td><td class="st">${e.subject}</td><td>${e.activity}</td><td>${e.site}</td>
        <td>${badge(e.status)}</td><td class="right"><button class="btn btn-s btn-xs" data-action="calendar-event" data-id="${e.subject}">进入采集</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">本月暂无任务</div></td></tr>`}</tbody></table></div></div>`;
}

/* ================= 统计 ================= */
function renderStats(){
  const st=db.stats||{enrolled:0,male:0,female:0,avgAge:'—',provinces:0,trend:[],provinceData:[],age:db.age};

  const tmax=Math.max(...trend,1);
  const prov=st.provinceData||[];
  const pmax=Math.max(...prov.map(p=>p[1]),1);
  const shade=v=>v>=pmax*.7?'#4f44a8':v>=pmax*.5?'#6d5bd0':v>=pmax*.3?'#9b8cf5':v>=pmax*.15?'#b5a8fa':'#e6e1fd';

      ${stat('入',st.enrolled.toLocaleString(),'累计入组',`计划 ${currentProject().plan.toLocaleString()} 例`)}

      ${stat('均',st.avgAge,'平均年龄','按入组时年龄')}

      <div class="panel"><div class="ph"><h3>入组趋势</h3><span class="more">近 12 个月</span></div>
        <div class="pb"><div class="trend">${trend.map((m,i)=>`<div class="tcol"><div class="tbar" style="height:${Math.max(4,m/tmax*100)}%"></div><span class="tlb">${i+1}月</span></div>`).join('')}</div></div></div>
      <div class="panel"><div class="ph"><h3>性别占比</h3><span class="more">${st.enrolled.toLocaleString()} 例</span></div>
        <div class="pb" style="display:flex;align-items:center;gap:22px">

          <div style="flex:1"><div class="kv"><span class="k"><i class="ld" style="background:#4f44a8"></i>男性</span><span class="v">${st.male.toLocaleString()} · ${mp}%</span></div>
            <div class="kv"><span class="k"><i class="ld" style="background:#8b7cf0"></i>女性</span><span class="v">${st.female.toLocaleString()} · ${fp}%</span></div></div></div></div>
    </div>
    <div class="g2">
      <div class="panel"><div class="ph"><h3>年龄段分布</h3><span class="more">按队列人群分组</span></div>
        <div class="pb">${(st.age||db.age).map(a=>`<div class="dist"><span class="dname">${a.g}</span><div class="dwrap"><div class="dfill" style="width:${a.n/maxAge*100}%"></div></div><span class="dval">${a.n}</span></div>`).join('')}</div></div>
      <div class="panel"><div class="ph"><h3>省份分布</h3><span class="more">按人数区间着色</span></div>
        <div class="pb"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">

    </div>`;
}

/* ================= 样本管理 ================= */
function renderSamples(){
  const tabs=['全部','已采集','已入库','已出库','已销毁'];
  const tab=state.sampleTab||'全部';
  const rows=db.samples.filter(x=>tab==='全部'||x.status===tab);
  const tps=db.queue.timepoints;
  const types=db.queue.sampleTypes.slice(0,6);
  const cell=(i,j)=>{
    const n=(i*3+j*2)%5;
    return `<button class="btn btn-s btn-xs" data-action="collect-sample" data-tp="${tps[i]}" data-type="${types[j]}" title="采集 / 登记">${n?n+' 份':'＋'}</button>`;
  };
  return `${pageHead('样本管理','按「采样时点 × 样本类型」组织登记，入库审核后完成闭环',`
      <button class="btn btn-s btn-sm" data-action="sample-review">入库审核</button>
      <button class="btn btn-p btn-sm" data-action="collect-sample">采集样本</button>`)}
    <div class="g4" style="margin-bottom:12px">
      ${stat('样',db.samples.length,'样本总数',db.queue.sampleTypes.slice(0,3).join(' / '))}
      ${stat('采',db.samples.filter(x=>x.status==='已采集').length,'待入库','待审核',db.samples.some(x=>x.status==='已采集')?'down':'up')}
      ${stat('库',db.samples.filter(x=>x.status==='已入库').length,'已入库','样本库')}
      ${stat('出',db.samples.filter(x=>x.status==='已出库').length,'已出库','待检测')}
    </div>
    <div class="panel" style="margin-bottom:12px"><div class="ph"><h3>时点 × 类型登记矩阵</h3><span class="more">点击单元格采集 / 登记</span></div>
      <div class="tw"><table class="tbl"><thead><tr><th>采样时点</th>${types.map(t=>`<th>${t}</th>`).join('')}</tr></thead>
      <tbody>${tps.map((tp,i)=>`<tr><td class="st">${tp}</td>${types.map((ty,j)=>`<td>${cell(i,j)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="pb"><div class="hint">每个「时点 × 类型」组合对应一张处理与暂存登记表；上传后进入入库登记表，审核通过完成入库。</div></div>
    </div>
    <div class="panel"><div class="ph"><h3>最近样本</h3><span class="more">${rows.length} 条</span></div>
      <div class="pb" style="padding-bottom:0"><div class="tabs" style="margin-bottom:0;border-bottom:none">
        ${tabs.map(t=>`<button class="tab ${tab===t?'active':''}" data-action="sample-tab" data-tab="${t}">${t}</button>`).join('')}</div></div>
      <div class="tw"><table class="tbl"><thead><tr><th>样本编码</th><th>受试者</th><th>类型</th><th>时点 / 访视</th><th>库位</th><th>状态</th><th>采集时间</th><th class="right">操作</th></tr></thead>
      <tbody>${rows.map(x=>`<tr><td class="mono st">${x.code}</td><td>${x.subject}</td><td>${x.type}</td><td>${x.visit}</td>
        <td class="mono">${x.box}</td><td>${badge(x.status)}</td><td class="mono">${x.time}</td>

/* ---- 搜索：输入后保持焦点 ---- */
document.addEventListener('input', e=>{
  const id=e.target.id;
  if(!['orgSearch','userSearch','subjectSearch','docSearch','archiveSearch','queryCode','dropSearch'].includes(id)) return;
  if(id==='orgSearch') state.orgFilter=e.target.value;
  if(id==='userSearch') state.userFilter=e.target.value;
  if(id==='subjectSearch') state.subjectFilter=e.target.value;
  if(id==='docSearch') state.docFilter=e.target.value;
  if(id==='archiveSearch') state.archiveFilter=e.target.value;
  if(id==='queryCode') state.qFilter={...(state.qFilter||{}),code:e.target.value};
  if(id==='dropSearch') state.dropFilter=e.target.value;
  render();
  const el=$('#'+id);
  if(el){ el.focus(); const v=el.value; el.setSelectionRange(v.length,v.length); }
});

/* ---- 角色切换 ---- */
document.addEventListener('change', e=>{
  if(['querySite','queryFrom','queryTo'].includes(e.target.id)){
    const key={querySite:'site',queryFrom:'from',queryTo:'to'}[e.target.id];
    state.qFilter={...(state.qFilter||{}),[key]:e.target.value};
    render(); return;
  }
  if(e.target.id==='dropSite'){ state.dropSite=e.target.value; render(); return; }
  if(e.target.id==='roleSelect'){
    state.role=e.target.value;
    render();
    toast(`已切换为 ${state.role}${state.role==='PI'?'，可查看随机组别':'，随机组别保持盲态'}`);
  }
});

/* ---- 全局搜索 / Esc / 遮罩 ---- */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && e.target.id==='globalSearch'){
    const v=e.target.value.trim();
    if(v){ state.subjectFilter=v; state.page='subjects'; render(); toast('已按「'+v+'」筛选受试者'); }

});
document.addEventListener('click', e=>{

  const acts=db.plan.activities.map(a=>`${a.code} ${a.name}`);
  modal('新增访视质询', `<div class="fg">
      <div class="field"><label>受试者 *</label><select class="select" id="qSubject">${db.subjects.map(s=>`<option value="${s.id}" ${s.id===sub?'selected':''}>${s.id} · ${s.name}</option>`).join('')}</select></div>
      <div class="field"><label>访视 / 活动 *</label><select class="select" id="qActivity">${acts.map(a=>`<option>${a}</option>`).join('')}</select></div>
      <div class="field"><label>所在表单</label><select class="select" id="qForm">${[...new Set([(db.queue.crf||{}).title,...db.questionnaires.map(q=>q.name),'合并用药'].filter(Boolean))].map(f=>`<option ${f===form?'selected':''}>${f}</option>`).join('')}</select></div>
      <div class="field"><label>字段 *</label><input class="input" id="qField" placeholder="如：收缩压" /></div>
      <div class="field"><label>质询类型</label><select class="select" id="qType"><option>更新类</option><option>方案修改类</option></select></div>
      <div class="field full"><label>质询说明 *</label><textarea id="qMsg" placeholder="备注原因，便于研究者处理"></textarea></div>
    </div><div class="hint">质询将出现在列表与受试者详情，并计入质询率；提出后可锁定数据防止修改。</div>`,
    `<button class="btn btn-s btn-sm" data-action="close-modal">取消</button>
     <button class="btn btn-p btn-sm" data-action="save-query">发出质询</button>`);
}
function openCollectSample(subject, tp, type){
  modal('采集样本', `<div class="fg">
      <div class="field"><label>受试者 *</label><select class="select" id="spSubject">${db.subjects.map(s=>`<option ${s.id===subject?'selected':''}>${s.id}</option>`).join('')}</select></div>
      <div class="field"><label>样本类型 *</label><select class="select" id="spType">${db.queue.sampleTypes.map(x=>`<option ${x===type?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>采样时点 / 访视</label><select class="select" id="spVisit">${db.queue.timepoints.map(x=>`<option ${x===tp?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>库位</label><input class="input" id="spBox" placeholder="A-05-01" /></div>
    </div><div class="hint">样本编码按「课题-中心-受试者-类型-流水号」自动生成，全局唯一。</div>`,
    `<button class="btn btn-s btn-sm" data-action="close-modal">取消</button>
     <button class="btn btn-p btn-sm" data-action="save-sample">确认采集</button>`);
}

/* ================= 启动（支持 #page 深链） ================= */
activateQueue('HIP');
const initPage=(location.hash||'').replace('#','');
if(PANEL[initPage]) go(initPage); else render();
window.addEventListener('hashchange',()=>{
  const p=(location.hash||'').replace('#','');
  if(PANEL[p]) go(p);
});

</script>
