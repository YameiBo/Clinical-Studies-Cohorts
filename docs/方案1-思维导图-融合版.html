const W = [260, 225, 210, 270];
const COL = 320, GAP_Y = 12;
const world = document.getElementById("world");
const nodesBox = document.getElementById("nodes");
const svg = document.getElementById("links");
let ALL = [], ROOT = null;

function build(src, depth, parent){
  const el = document.createElement("div");
  el.className = "node n" + depth;
  el.style.width = W[depth] + "px";
  const ttl = document.createElement("div");
  ttl.className = "ttl";
  ttl.textContent = src.name;
  el.appendChild(ttl);
  if (src.note){
    const nt = document.createElement("div");
    nt.className = "note";
    nt.textContent = src.note;
    el.appendChild(nt);
  }
  const tg = document.createElement("span");
  tg.className = "tg";
  el.appendChild(tg);

  const color = src.color || (parent ? parent.color : "#0f172a");
  if (depth === 1){ el.style.borderLeftColor = color; ttl.style.color = color; }

  const n = { name: src.name, dom: el, tg, depth, parent, color, children: [], collapsed: false };
  nodesBox.appendChild(el);

  if (src.children) src.children.forEach(c => n.children.push(build(c, depth + 1, n)));

  el.addEventListener("click", () => {
    if (n.children.length){ n.collapsed = !n.collapsed; refresh(); }
  });
  if (n.children.length) el.style.cursor = "pointer";

  ALL.push(n);
  return n;
}

function refresh(){
  function setVis(n, pv){
    n.visible = pv;
    n.dom.style.display = pv ? "" : "none";
    n.children.forEach(c => setVis(c, pv && !n.collapsed));
  }
  setVis(ROOT, true);

  ALL.forEach(n => { if (n.visible){ n.w = n.dom.offsetWidth; n.h = n.dom.offsetHeight; } });

  function calc(n){
    if (!n.visible){ n.subH = 0; return; }
    if (!n.collapsed && n.children.length){
      let total = 0;
      n.children.forEach((c, i) => { calc(c); total += c.subH; if (i) total += GAP_Y; });
      n.childrenH = total;
      n.subH = Math.max(n.h, total);
    } else {
      n.childrenH = 0;
      n.subH = n.h;
    }
  }
  calc(ROOT);

  function place(n, x, top){
    if (!n.visible) return;
    n.x = x;
    n.y = top + (n.subH - n.h) / 2;
    if (!n.collapsed && n.children.length){
      let cy = top + (n.subH - n.childrenH) / 2;
      n.children.forEach(c => { place(c, x + COL, cy); cy += c.subH + GAP_Y; });
    }
  }
  place(ROOT, 0, 0);

  let maxX = 0, maxY = 0;
  ALL.forEach(n => {
    if (!n.visible) return;
    n.dom.style.left = n.x + "px";
    n.dom.style.top = n.y + "px";
    if (n.children.length){
      n.tg.textContent = n.collapsed ? "+" + n.children.length : "−";
      n.tg.classList.toggle("off", !n.collapsed);
      n.tg.style.display = "";
    } else {
      n.tg.style.display = "none";
    }
    maxX = Math.max(maxX, n.x + n.w);
    maxY = Math.max(maxY, n.y + n.h);
  });

  world.style.width = (maxX + 60) + "px";
  world.style.height = (maxY + 60) + "px";
  drawLinks();
}

function drawLinks(){
  svg.innerHTML = "";
  const frag = document.createDocumentFragment();
  function walk(n){
    if (!n.visible || n.collapsed) return;
    n.children.forEach(c => {
      if (!c.visible) return;
      const x1 = n.x + n.w, y1 = n.y + n.h / 2;
      const x2 = c.x, y2 = c.y + c.h / 2;
      const mx = (x1 + x2) / 2;
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", c.color);
      p.setAttribute("stroke-width", "2");
      p.setAttribute("stroke-opacity", "0.45");
      p.setAttribute("stroke-linecap", "round");
      frag.appendChild(p);
      walk(c);
    });
  }
  walk(ROOT);
  svg.appendChild(frag);
}

ROOT = build(DATA, 0, null);
ALL.forEach(n => { if (n.depth >= 2) n.collapsed = true; });

document.getElementById("expandAll").addEventListener("click", () => {
  ALL.forEach(n => n.collapsed = false);
  refresh();
});
document.getElementById("collapseMod").addEventListener("click", () => {
  ALL.forEach(n => { n.collapsed = n.depth >= 1; });
  refresh();
});

refresh();
window.addEventListener("resize", refresh);
